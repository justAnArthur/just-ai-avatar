# publish-bumped-tags.yml
# ---
# bump-version pushes its release tags with the default GITHUB_TOKEN, and
# GitHub doesn't start workflows from pushes made with that token, so
# publish-npm-on-tag never fires for them. This workflow closes the gap
# without editing the toolkit-managed workflows (`update` would overwrite
# local edits): when bump-version finishes, it finds the tags that run
# created and dispatches publish-npm-on-tag for each one. workflow_dispatch
# is one of the events GITHUB_TOKEN is allowed to trigger.
#
# Run it by hand with a commit SHA to publish the tags a past bump created.
# ---

name: publish-bumped-tags
run-name: "publish-bumped-tags — ${{ inputs.head_sha || github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: [ bump-version ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "commit the bump ran on; tags on its bump commit get published"
        type: string
        required: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch publish-npm-on-tag for new release tags
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags --force --quiet
          head=$(git rev-parse "$HEAD_SHA^{commit}")

          # bump-version commits on top of the commit it ran on and tags that
          # bump commit, so a release tag from this run sits on a child of $head.
          found=0
          for tag in $(git tag --list '*@*' --contains "$head"); do
            commit=$(git rev-list -n 1 "$tag")
            [ "$(git rev-parse "$commit^" 2>/dev/null)" = "$head" ] || continue

            pkg="${tag%@*}"
            version="${tag##*@}"
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "skip $tag: already on npm"
              continue
            fi

            echo "dispatch publish-npm-on-tag for $tag"
            gh workflow run publish-npm-on-tag.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$tag"
            found=1
          done

          [ "$found" = 1 ] || echo "no new release tags from this bump"
